name: AWS platform (Docker build)

# Build de imagens no CI; push ECR só com secrets OIDC configurados.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: tcg-judge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build worker image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/workers/Dockerfile
          push: false
          tags: tcg-judge-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend/runtime_console_v3

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          API_PROXY_TARGET: https://seekguidance.onrender.com
          NEXT_PUBLIC_FEATURE_GLOBAL_SEARCH: "true"
          NEXT_PUBLIC_FEATURE_HEADER_NOTIFICATIONS: "true"
      - run: npx playwright test --project=chromium
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_PROXY_TARGET: https://seekguidance.onrender.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/runtime_console_v3/playwright-report/
            frontend/runtime_console_v3/test-results/

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: |
          pip install ../ingestion
          pip install -r requirements.txt
      - name: Ruff check
        run: ruff check app tests evaluation
      - name: Pytest
        run: pytest -q -m "not integration and not e2e and not smoke"

  judge_grade_gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: |
          pip install ../ingestion
          pip install -r requirements.txt
      - name: Judge-grade gates
        run: pytest -q -m judge_grade

  # Mobile app (inline no monorepo — apps/mobile)
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace=mobile

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=runtime-console-v3
      - name: Type-check
        run: npm run type-check --workspace=runtime-console-v3
      - name: Vitest
        run: npm run test --workspace=runtime-console-v3
      - name: Build
        run: npm run build --workspace=runtime-console-v3

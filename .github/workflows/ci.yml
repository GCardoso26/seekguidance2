name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: |
          pip install ../ingestion
          pip install -r requirements.txt
      - name: Ruff check
        run: ruff check app tests evaluation
      - name: Pytest
        run: pytest -q -m "not integration and not e2e"

  judge_grade_gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: |
          pip install ../ingestion
          pip install -r requirements.txt
      - name: Judge-grade gates
        run: pytest -q -m judge_grade

  # Submódulo: .gitmodules → https://github.com/guibruno93/seekguidance-mobile
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Init mobile submodule (optional)
        id: mobile_submodule
        run: git submodule update --init --depth 1 apps/mobile
        continue-on-error: true
      - uses: actions/setup-node@v4
        if: steps.mobile_submodule.outcome == 'success'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install
        if: steps.mobile_submodule.outcome == 'success'
        run: npm ci
      - name: Typecheck
        if: steps.mobile_submodule.outcome == 'success'
        run: npm run typecheck
      - name: Skip (submodule unavailable)
        if: steps.mobile_submodule.outcome != 'success'
        run: echo "apps/mobile submodule not available — skipping mobile CI"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/runtime_console_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/runtime_console_v3/package-lock.json
      - name: Install
        run: npm ci
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build

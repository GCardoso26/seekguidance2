# Dispara deploy na Vercel sem depender do autor Git (evita bloqueio Co-authored-by Cursor no Hobby).
#
# Método preferido: Vercel CLI (envia o código do checkout, não usa autor do commit Git).
# Fallback: Deploy Hook (pode ser cancelado se o commit tiver Co-authored-by: Cursor).
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN          — Vercel → Account Settings → Tokens (recomendado)
#   VERCEL_DEPLOY_HOOK    — project-eye28 → Settings → Git → Deploy Hooks (fallback)

name: Vercel Deploy Hook

on:
  push:
    branches: [main]
    paths:
      - "frontend/runtime_console_v3/**"
      - ".github/workflows/vercel-deploy-hook.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_1ZCdnwroiBPBQ3byT0xG3spl
  VERCEL_PROJECT_ID: prj_7b8QzP5OPHfXKV4YbUT0a8sPn74p

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "${VERCEL_TOKEN}" ]; then
            echo "Deploy via CLI → project-eye28 (production)..."
            npm install -g vercel@50
            vercel deploy --prod --yes --archive=tgz \
              --token="${VERCEL_TOKEN}" \
              --scope="${VERCEL_ORG_ID}"
            echo "Deploy CLI concluído."
          elif [ -n "${VERCEL_DEPLOY_HOOK}" ]; then
            echo "Deploy via hook → project-eye28..."
            curl -fsS -X POST "${VERCEL_DEPLOY_HOOK}"
            echo "Deploy hook acionado."
          else
            echo "::error::Configure VERCEL_TOKEN (recomendado) ou VERCEL_DEPLOY_HOOK em GitHub Secrets."
            exit 1
          fi

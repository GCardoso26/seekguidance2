name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://judgetcg.com.br/
            https://judgetcg.com.br/marketplace
          budgetPath: ./frontend/runtime_console_v3/lighthouse-budget.json
          uploadArtifacts: true

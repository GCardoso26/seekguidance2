name: Load Test

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL
        default: https://judgetcg.com.br
        required: true
      duration:
        description: Smoke test duration
        default: 1m
        required: true
      full_load:
        description: Run full load test (40+ min)
        type: boolean
        default: false

defaults:
  run:
    working-directory: frontend/runtime_console_v3

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run smoke load test
        if: ${{ github.event.inputs.full_load != true }}
        run: |
          mkdir -p k6
          k6 run \
            --env BASE_URL=${{ github.event.inputs.base_url || 'https://judgetcg.com.br' }} \
            --env DURATION=${{ github.event.inputs.duration || '1m' }} \
            k6/search-smoke-test.js

      - name: Run full load test
        if: ${{ github.event.inputs.full_load == true }}
        run: |
          mkdir -p k6
          k6 run \
            --env BASE_URL=${{ github.event.inputs.base_url || 'https://judgetcg.com.br' }} \
            --env SCENARIO=normal_load \
            k6/search-load-test.js

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: |
            frontend/runtime_console_v3/k6/summary-smoke.json
            frontend/runtime_console_v3/k6/summary-search.json
          if-no-files-found: warn

name: Quality Gates

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main, develop, release/**]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/runtime_console_v3/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/quality-gates.yml'
            api:
              - 'services/api/**'
              - 'services/ingestion/**'
              - '.github/workflows/quality-gates.yml'

  frontend-quality:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint --workspace=runtime-console-v3
      - name: Type-check
        run: npm run type-check --workspace=runtime-console-v3
      - name: Vitest
        run: npm run test --workspace=runtime-console-v3
      - name: Design System audit
        run: npm run ds:audit --workspace=runtime-console-v3
      - name: Build
        run: npm run build --workspace=runtime-console-v3

  api-quality:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: |
          pip install ../ingestion
          pip install -r requirements.txt
      - name: Ruff check
        run: ruff check app tests evaluation
      - name: Pytest (unit)
        run: pytest -q -m "not integration and not e2e and not smoke"

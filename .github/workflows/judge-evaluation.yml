name: Judge Evaluation

on:
  pull_request:
    paths:
      - "services/api/app/retrieval/**"
      - "services/api/app/judge/**"
      - "services/api/app/application/rag_orchestrator.py"
      - "services/api/app/core/config.py"
      - "services/api/app/judge_prompts/**"
      - "services/api/app/runtime_judge_semantic_cache/**"
      - "services/api/evaluation/judge_quality/**"
      - "services/ingestion/**"
      - "services/api/jobs/**"
      - ".github/workflows/judge-evaluation.yml"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: |
          pip install ../ingestion
          pip install -r requirements.txt

      - name: Run judge evaluation gates
        id: eval
        run: python ../../scripts/run_judge_evaluation.py
        continue-on-error: true

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: judge-evaluation-report
          path: |
            services/api/evaluation/judge_quality/reports/latest.json
            services/api/evaluation/judge_quality/reports/pr_comment.md

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'services/api/evaluation/judge_quality/reports/pr_comment.md';
            let body = '## Judge Evaluation\n\n_Sem relatório gerado._';
            try {
              body = fs.readFileSync(path, 'utf8');
            } catch (e) {}
            const exitCode = ${{ steps.eval.outcome == 'success' && 0 || 1 }};
            if (exitCode !== 0) {
              body += '\n\n**Gates:** falhou — accuracy@1 -5% ou confidence_avg < 0.55.';
            } else {
              body += '\n\n**Gates:** passou.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if gates failed
        if: steps.eval.outcome != 'success'
        run: exit 1

name: Checkout Race Tests

on:
  push:
    branches: [main]
    paths:
      - services/api/app/marketplace/checkout_atomic.py
      - services/api/tests/marketplace/**
      - supabase/migrations/*checkout*
  pull_request:
    paths:
      - services/api/app/marketplace/checkout_atomic.py
      - services/api/tests/marketplace/**
      - supabase/migrations/*checkout*
  workflow_dispatch:

jobs:
  race:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: |
          pip install ../ingestion
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Race condition tests (Docker Postgres)
        env:
          CHECKOUT_RACE_TESTS: "1"
          RUN_CHECKOUT_RACE_DOCKER: "1"
        run: pytest tests/marketplace/test_checkout_race_condition.py -v -m race

name: Lighthouse PR Comment

on:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend/runtime_console_v3

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npx lhci autorun
        continue-on-error: true
      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const lhciDir = path.join(process.cwd(), '.lighthouseci');
            if (!fs.existsSync(lhciDir)) {
              console.log('No LHCI results');
              return;
            }
            const files = fs.readdirSync(lhciDir).filter((f) => f.startsWith('lhr-') && f.endsWith('.json'));
            if (!files.length) return;
            const lhr = JSON.parse(fs.readFileSync(path.join(lhciDir, files.sort().pop()), 'utf8'));
            const s = (cat) => Math.round((lhr.categories[cat]?.score ?? 0) * 100);
            const body = `## Lighthouse Report

            | Category | Score |
            |----------|-------|
            | Performance | ${s('performance')} |
            | Accessibility | ${s('accessibility')} |
            | Best Practices | ${s('best-practices')} |
            | SEO | ${s('seo')} |`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

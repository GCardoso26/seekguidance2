# Fragmento OTEL collector (VNext) — juntar ao collector real do ambiente.
receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  debug: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]

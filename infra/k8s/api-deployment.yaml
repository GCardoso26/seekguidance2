apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg-judge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tcg-judge-api
  template:
    metadata:
      labels:
        app: tcg-judge-api
    spec:
      containers:
        - name: api
          image: tcg-judge-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tcg-judge-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tcg-judge-secrets
                  key: redis_url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: tcg-judge-api
spec:
  selector:
    app: tcg-judge-api
  ports:
    - port: 80
      targetPort: 8000

replicaCount: 2

image:
  repository: REPLACE_ME_ECR/tcg-judge-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

gpu:
  enabled: false
  # Quando enabled: true, definir nodeSelector/tolerations no deployment via values.
nodeSelector: {}
tolerations: []

probes:
  readinessPath: /
  livenessPath: /

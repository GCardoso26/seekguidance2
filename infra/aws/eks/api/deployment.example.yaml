apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg-judge-api
  namespace: api
  labels:
    app.kubernetes.io/name: tcg-judge-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tcg-judge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcg-judge-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: REPLACE_ME_ECR/tcg-judge-api:TAG
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: tcg-judge-api-env
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

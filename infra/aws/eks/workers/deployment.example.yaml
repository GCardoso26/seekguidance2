apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg-judge-workers
  namespace: workers
  labels:
    app.kubernetes.io/name: tcg-judge-workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tcg-judge-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcg-judge-workers
    spec:
      containers:
        - name: worker
          image: REPLACE_ME_ECR/tcg-judge-worker:TAG
          envFrom:
            - secretRef:
                name: tcg-judge-worker-env
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"

# Blueprint Render: API FastAPI (Docker com contexto na raiz do repositório).
# Criar na dashboard: Postgres + Redis (ou externos) e copiar DATABASE_URL / REDIS_URL para o serviço.
#
# Documentação: docs/DEPLOY_RENDER_VERCEL.md

services:
  - type: web
    name: tcg-judge-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

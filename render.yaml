# Render — Key Value (Redis) para tcg-judge-api

services:
  - type: keyvalue
    name: tcg-judge-redis
    # Paid Key Value — BullMQ exige noeviction (não usar Free / allkeys-lru)
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: tcg-judge-api
    runtime: docker
    # Fora do Free: evita cold start e CPU compartilhada em produção
    plan: standard
    region: oregon
    dockerfilePath: services/api/Dockerfile.production
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_MODE
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_SSL
        value: require
      # Session pooler ~15 clients — API Python capped (was 20+10)
      - key: DB_POOL_SIZE
        value: "4"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: RUNTIME_AUTH_SECRET
        generateValue: true
      # Nunca fixar senha fraca em produção — definir secret forte no dashboard Render.
      - key: RUNTIME_DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CPF_SALT
        sync: false
      - key: PIX_WEBHOOK_INTERNAL_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tcg-judge-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: PLATFORM_PIX_KEY
        sync: false
      - key: PLATFORM_PIX_KEY_TYPE
        sync: false
      - key: OPENPIX_API_KEY
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: OPENPIX_WEBHOOK_SECRET
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: MELHOR_ENVIO_SANDBOX
        value: "true"
      - key: MELHOR_ENVIO_DEFAULT_SERVICE_ID
        value: "1"
      - key: MELHOR_ENVIO_FROM_ADDRESS
        sync: false
      - key: MELHOR_ENVIO_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_CRON_SECRET
        sync: false

  # Checkout BC V2 — Node HTTP (não é o FastAPI legado)
  - type: web
    name: tcg-judge-checkout-v2
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHECKOUT_V2_FORCE
        value: "1"
      - key: CHECKOUT_PAYMENT_GATEWAY
        value: stripe
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: MELHOR_ENVIO_SANDBOX
        value: "false"

  # Product-catalog BullMQ workers — processa sealed/accessories de verdade
  - type: worker
    name: tcg-judge-pc-workers
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: services/api/Dockerfile.workers
    envVars:
      - key: NODE_ENV
        value: production
      - key: BULLMQ_WORKERS
        value: "1"
      # Subir só após medir pool Postgres + 429 externos; 2 é o degrau seguro pós-Free
      - key: BULLMQ_CONCURRENCY
        value: "2"
      - key: PG_POOL_MAX
        value: "3"
      - key: DATABASE_URL
        sync: false
      # Object storage próprio (ADR-017). Sem estas quatro o pipeline usa NoopObjectStorage
      # e mantém a URL de origem — é o estado seguro.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # https://cdn.judgetcg.com.br — só ligar DEPOIS do backfill-asset-storage.ts
      # concluir (ADR-017, ordem de corte).
      - key: PRODUCT_CATALOG_R2_PUBLIC_BASE
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tcg-judge-redis
          property: connectionString

  # Sealed sync horário (bypass fila — garante dados mesmo se worker/Redis falhar)
  - type: cron
    name: tcg-judge-pc-sealed-hourly
    runtime: docker
    plan: starter
    region: oregon
    schedule: "20 * * * *"
    dockerfilePath: services/api/Dockerfile.workers
    dockerCommand: node dist/product-catalog/workers/cron-entrypoint.js sealed
    envVars:
      - key: NODE_ENV
        value: production
      - key: PG_POOL_MAX
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: PRODUCT_CATALOG_R2_PUBLIC_BASE
        sync: false

  # Accessories diário
  - type: cron
    name: tcg-judge-pc-accessories-daily
    runtime: docker
    plan: starter
    region: oregon
    schedule: "30 8 * * *"
    dockerfilePath: services/api/Dockerfile.workers
    dockerCommand: node dist/product-catalog/workers/cron-entrypoint.js accessories
    envVars:
      - key: NODE_ENV
        value: production
      - key: PG_POOL_MAX
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: PRODUCT_CATALOG_R2_PUBLIC_BASE
        sync: false

  # Scheduler tick — enfileira providers due no Redis
  - type: cron
    name: tcg-judge-pc-scheduler-tick
    runtime: docker
    plan: starter
    region: oregon
    schedule: "5 * * * *"
    dockerfilePath: services/api/Dockerfile.workers
    dockerCommand: node dist/product-catalog/workers/cron-entrypoint.js tick
    envVars:
      - key: NODE_ENV
        value: production
      - key: PG_POOL_MAX
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tcg-judge-redis
          property: connectionString


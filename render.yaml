# Render — Key Value (Redis) para tcg-judge-api

services:
  - type: keyvalue
    name: tcg-judge-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: tcg-judge-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: services/api/Dockerfile.production
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_SSL
        value: require
      - key: RUNTIME_AUTH_SECRET
        generateValue: true
      - key: RUNTIME_DEFAULT_ADMIN_PASSWORD
        value: admin
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tcg-judge-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PLATFORM_PIX_KEY
        sync: false
      - key: PLATFORM_PIX_KEY_TYPE
        sync: false
      - key: OPENPIX_API_KEY
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: OPENPIX_WEBHOOK_SECRET
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: MELHOR_ENVIO_SANDBOX
        value: "true"
      - key: MELHOR_ENVIO_DEFAULT_SERVICE_ID
        value: "1"
      - key: MELHOR_ENVIO_FROM_ADDRESS
        sync: false
      - key: MELHOR_ENVIO_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_CRON_SECRET
        sync: false

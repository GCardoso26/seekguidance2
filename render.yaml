# Render — Key Value (Redis) para tcg-judge-api

services:
  - type: keyvalue
    name: tcg-judge-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: tcg-judge-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: services/api/Dockerfile.production
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_SSL
        value: require
      - key: RUNTIME_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tcg-judge-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

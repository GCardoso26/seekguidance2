# Blueprint Render — API FastAPI (Docker, monorepo na raiz).
# Docs: docs/DEPLOY_SEM_EC2_RENDER_VERCEL.md
#
# No 1º deploy o Render pede valores para variáveis sync: false (DATABASE_URL, REDIS_URL, OPENAI_API_KEY).

services:
  - type: web
    name: tcg-judge-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: services/api/Dockerfile.production
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_SSL
        value: require
      - key: RUNTIME_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

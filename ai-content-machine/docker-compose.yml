# Content War Machine stack (isolated from TCG Judge compose)
# Usage: docker compose -f ai-content-machine/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cwm
      POSTGRES_PASSWORD: cwm_dev
      POSTGRES_DB: content_war
    ports:
      - "5433:5432"
    volumes:
      - cwm_pg:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwm -d content_war"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_n8n:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_dev
      POSTGRES_DB: n8n
    volumes:
      - cwm_n8n_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cwm_redis:/data

  n8n:
    image: n8nio/n8n:1.72.1
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres_n8n
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n_dev
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Sao_Paulo
      CWM_API_BASE: http://api:8787
    depends_on:
      postgres_n8n:
        condition: service_healthy
    volumes:
      - cwm_n8n_data:/home/node/.n8n

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      AUTOMATION_MODE: mock
      PORT: 8787
      CWM_DB_PATH: /data/cwm.sqlite
      N8N_BASE_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      CWM_API_BASE: http://api:8787
    ports:
      - "8787:8787"
    volumes:
      - cwm_api_data:/data
    depends_on:
      - redis

volumes:
  cwm_pg:
  cwm_n8n_pg:
  cwm_redis:
  cwm_n8n_data:
  cwm_api_data:

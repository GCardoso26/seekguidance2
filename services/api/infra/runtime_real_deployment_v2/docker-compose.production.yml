services:
  runtime-api:
    build:
      context: ../..
      dockerfile: services/api/infra/runtime_real_deployment_v2/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      RUNTIME_DATA_DIR: /data/runtime
    volumes:
      - runtime_data:/data/runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  runtime-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RUNTIME_PG_USER:-runtime}
      POSTGRES_PASSWORD: ${RUNTIME_PG_PASSWORD:-runtime}
      POSTGRES_DB: ${RUNTIME_PG_DB:-runtime}
    volumes:
      - pg_data:/var/lib/postgresql/data
    profiles:
      - postgres

volumes:
  runtime_data:
  pg_data:

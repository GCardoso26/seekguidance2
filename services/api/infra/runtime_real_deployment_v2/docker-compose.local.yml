services:
  runtime-api:
    build:
      context: ../..
      dockerfile: services/api/infra/runtime_real_deployment_v2/Dockerfile
    ports:
      - "8000:8000"
    environment:
      RUNTIME_AUTH_SECRET: ${RUNTIME_AUTH_SECRET:-local-dev-secret}
      RUNTIME_DATA_DIR: /data/runtime
    volumes:
      - runtime_data:/data/runtime

volumes:
  runtime_data:

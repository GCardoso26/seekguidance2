[pytest]
asyncio_mode = auto
markers =
    integration: requer Docker + testcontainers (Postgres pgvector)
    e2e: requer stack real (ingest + API + OPENAI_API_KEY)
    judge_grade: gates de prontidão judge-grade (rápidos)
    adversarial: invariantes / inputs hostis (rápidos)
    smoke: smoke rápido (docs / schema)
    stress: stress combinatório opcional (rápido neste repo)

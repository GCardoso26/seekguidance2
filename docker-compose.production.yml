# Produção EC2 — API + worker opcional; Postgres Supabase; Redis Upstash (recomendado).
# Uso: docker compose -f docker-compose.production.yml --env-file .env.production up -d api
#
# Redis local (legado): docker compose -f docker-compose.production.yml --profile local-redis up -d

name: tcg-judge-production

services:
  redis:
    profiles: ["local-redis"]
    image: redis:7-alpine
    container_name: tcg-judge-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile.production
    container_name: tcg-judge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      # Segredos (DATABASE_URL, REDIS_URL, …) só via env_file — evita export do shell sobrescrever
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      RUNTIME_AUTH_SECRET: ${RUNTIME_AUTH_SECRET}
      RUNTIME_DATA_DIR: /data/runtime
      RUNTIME_PROMETHEUS: ${RUNTIME_PROMETHEUS:-false}
      RUNTIME_OTLP: ${RUNTIME_OTLP:-false}
    volumes:
      - runtime_data:/data/runtime
    dns:
      - 172.31.0.2
      - 169.254.169.253
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    container_name: tcg-judge-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
    dns:
      - 172.31.0.2
      - 169.254.169.253

volumes:
  redis_data:
  runtime_data:
